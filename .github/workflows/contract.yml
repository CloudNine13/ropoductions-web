name: contract

on:
  pull_request:
    branches: [develop]
    paths:
      - "migrations/**"
      - "wrangler.toml"
      - "src/lib/db.ts"
      - "src/lib/auth.ts"
      - "src/lib/patreon.ts"
      - "src/lib/crypto.ts"
      - "src/lib/cookies.ts"
      - "src/app/api/auth/**"
      - "tests/verify-*"
  push:
    branches: [develop]
    paths:
      - "migrations/**"
      - "wrangler.toml"
      - "src/lib/db.ts"
      - "src/lib/auth.ts"
      - "src/lib/patreon.ts"
      - "src/lib/crypto.ts"
      - "src/lib/cookies.ts"
      - "src/app/api/auth/**"
      - "tests/verify-*"

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: D1 schema and Patreon OAuth verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations to local database
        run: npx wrangler d1 migrations apply DB --local

      - name: Verify D1 schema and queries
        run: npm run test:d1

      - name: Verify Patreon OAuth and PKCE
        run: npm run test:oauth
