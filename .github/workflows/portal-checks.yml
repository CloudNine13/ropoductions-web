name: portal-checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: portal-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-guardrails:
    name: unit guardrails (tsc + node tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and base-contract guardrails
        run: npm run test:unit

  contract-verify:
    name: contract verify (D1 schema + Patreon OAuth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations to local database
        run: npx wrangler d1 migrations apply DB --local

      - name: Verify D1 schema and queries
        run: npm run test:d1

      - name: Verify Patreon OAuth and PKCE
        run: npm run test:oauth

  build-next:
    name: build (Next.js production bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:next

  e2e-chromium:
    name: e2e (Chromium portal flows)
    runs-on: ubuntu-latest
    needs: [unit-guardrails, contract-verify, build-next]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:next

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium shell
        run: npx playwright install --only-shell chromium

      - name: Run Chromium E2E suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload failure evidence
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
