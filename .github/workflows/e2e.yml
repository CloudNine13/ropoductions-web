name: e2e

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            should_run:
              - "src/**"
              - "e2e/**"
              - "scripts/**"
              - "migrations/**"
              - "wrangler.toml"
              - "public/**"
              - "package.json"
              - "package-lock.json"
              - "tsconfig*.json"
              - "next.config.ts"
              - "playwright.config.ts"
              - ".github/workflows/e2e.yml"

  e2e:
    name: Chromium and Firefox portal flows
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium shell
        run: npx playwright install --only-shell chromium

      - name: Install Firefox
        run: npx playwright install firefox

      - name: Run Chromium and Firefox E2E suites
        # Headed Firefox needs a display for its WebGL path; xvfb provides it.
        run: xvfb-run -a npm run test:e2e
        env:
          CI: true

      - name: Upload failure evidence
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
