name: ci

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build:next

      - run: npx playwright install --only-shell chromium

      - run: npm run test:e2e
        env:
          CI: true
