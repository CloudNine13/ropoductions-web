name: build

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            should_run:
              - "src/**"
              - "public/**"
              - "package.json"
              - "package-lock.json"
              - "tsconfig*.json"
              - "next.config.ts"
              - "wrangler.toml"
              - "open-next.config.ts"
              - ".github/workflows/build.yml"

  build:
    name: Next.js bundle and OpenNext worker build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare worker bundle
        run: npm run build
