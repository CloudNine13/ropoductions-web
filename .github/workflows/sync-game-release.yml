name: Sync Game Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Upstream branch to sync (defaults to main)"
        required: false
        default: "main"
  repository_dispatch:
    types:
      - game_release_published

concurrency:
  group: sync-game-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-and-deploy:
    name: Ingest Game Release & Sync R2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ropoductions-web
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Upstream Release Branch
        id: resolve-branch
        env:
          BRANCH_INPUT: ${{ github.event.inputs.branch || github.event.client_payload.branch || 'main' }}
        run: |
          SAFE_BRANCH=$(npx tsx scripts/sync-game-release.ts resolve-branch)
          echo "safe_branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Resolved release branch: ${SAFE_BRANCH}"

      - name: Shallow Clone Upstream Release
        env:
          SAFE_BRANCH: ${{ steps.resolve-branch.outputs.safe_branch }}
          UPSTREAM_READ_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
        run: |
          mkdir -p tmp_upstream
          AUTH_HEADER=$(echo -n "x-access-token:${UPSTREAM_READ_TOKEN}" | base64 -w 0)
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" clone \
            --depth 1 \
            --branch "${SAFE_BRANCH}" \
            -- "https://github.com/salamin888/Final_Orginity.git" \
            tmp_upstream

          UPSTREAM_SHA=$(git -C tmp_upstream rev-parse --short HEAD)
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
        id: clone-upstream

      - name: Execute Game Release Ingestion Engine
        env:
          UPSTREAM_DIR: tmp_upstream
          SHELL_OUTPUT_DIR: tmp_engine_shell
          BRIDGE_PLUGIN_PATH: src/engine-plugins/Ropoductions_WebBridge.js
          BRANCH_INPUT: ${{ steps.resolve-branch.outputs.safe_branch }}
          UPSTREAM_COMMIT_SHA: ${{ steps.clone-upstream.outputs.upstream_sha }}
        run: |
          npx tsx scripts/sync-game-release.ts tmp_upstream "${SHELL_OUTPUT_DIR}" "${BRANCH_INPUT}"

      - name: Synchronize Static Media Assets to Private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ropoductions-game-assets
        run: |
          # Locate game root relative to cloned repository
          GAME_ROOT=$(npx tsx scripts/sync-game-release.ts locate-game-root tmp_upstream)
          echo "Syncing media assets from: ${GAME_ROOT}"

          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Strictly additive S3 sync (never purge files to protect historic saves)
          for dir in audio img effects movies data; do
            if [ -d "${GAME_ROOT}/${dir}" ]; then
              echo "==> Syncing ${dir}/ to R2 bucket: ${R2_BUCKET_NAME}/${dir}"
              aws s3 sync "${GAME_ROOT}/${dir}" "s3://${R2_BUCKET_NAME}/${dir}" \
                --endpoint-url "${R2_ENDPOINT}"
            fi
          done

      - name: Synchronize Engine Shell to Private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ropoductions-game-assets
        run: |
          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Strictly additive S3 sync of the MZ shell (index.html, js/, css/,
          # fonts/, icon/, package.json) under the engine/ prefix, served
          # same-origin at /engine/* and streamed on demand. The staged shell is
          # already release-addressed by the ingestion engine, which is the only
          # component that knows a game release exists: the runtime never reads a
          # release identifier. build-metadata.json records that identifier for
          # humans and is deliberately NOT published to the bucket.
          #
          # The publish runs in two ordered phases so the document lands last.
          # index.html is the file that introduces the new identifier set, so a
          # client that reads it must never find a subresource still holding the
          # previous release's bytes: an addressed subresource response is cached
          # immutably for a year, so such a mix would not self-heal.
          echo "==> Publishing engine shell files (every object except index.html)"
          aws s3 sync tmp_engine_shell "s3://${R2_BUCKET_NAME}/engine" \
            --exclude "build-metadata.json" \
            --exclude "index.html" \
            --endpoint-url "${R2_ENDPOINT}"

          echo "==> Publishing engine shell document (index.html) last"
          aws s3 sync tmp_engine_shell "s3://${R2_BUCKET_NAME}/engine" \
            --exclude "*" \
            --include "index.html" \
            --endpoint-url "${R2_ENDPOINT}"

          echo "==> Published engine shell (release metadata kept in the runner log only):"
          cat tmp_engine_shell/build-metadata.json

      - name: Cleanup Runner Workspace
        if: always()
        run: |
          rm -rf tmp_upstream tmp_engine_shell