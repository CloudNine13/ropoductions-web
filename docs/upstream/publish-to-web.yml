# =============================================================================
# Upstream Game Release Publication Workflow
# File: salamin888/Final_Orginity:.github/workflows/publish-to-web.yml
# =============================================================================
# This workflow allows upstream game maintainers (salamin888) to trigger
# publication to CloudNine13/ropoductions-web on-demand without holding
# Cloudflare R2 credentials or repository write access.
#
# Prerequisite:
# 1. Add secret ROPODUCTIONS_TRIGGER_TOKEN to salamin888/Final_Orginity repository secrets.
#    (Fine-grained PAT issued with Actions: Read and write on CloudNine13/ropoductions-web)

name: Publish Game to Web Portal

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or release tag to publish (or 'auto' to use tools/release.json)"
        required: true
        default: "auto"

jobs:
  dispatch-to-portal:
    name: Trigger ropoductions-web Ingestion
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Event to ropoductions-web
        env:
          TRIGGER_TOKEN: ${{ secrets.ROPODUCTIONS_TRIGGER_TOKEN }}
          PUBLISH_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          echo "Dispatching game_release_published event to CloudNine13/ropoductions-web (branch: ${PUBLISH_BRANCH})..."
          
          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TRIGGER_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/CloudNine13/ropoductions-web/dispatches \
            -d "{\"event_type\": \"game_release_published\", \"client_payload\": {\"branch\": \"${PUBLISH_BRANCH}\"}}")

          if [ "$HTTP_STATUS" -ne 204 ]; then
            echo "Failed to dispatch event! HTTP Status: ${HTTP_STATUS}"
            cat response.json
            exit 1
          fi

          echo "Successfully triggered ingestion in CloudNine13/ropoductions-web."
