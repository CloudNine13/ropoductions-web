<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="image-rendering: pixelated; font-family: monospace;">
  <defs>
    <linearGradient id="godotSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="citadelGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="960" height="540" fill="url(#godotSky)" />

  <!-- Futuristic Distant Floating Citadels -->
  <polygon points="120,240 180,180 240,240 210,320 150,320" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5" opacity="0.7" />
  <polygon points="700,200 780,130 860,200 820,290 740,290" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5" opacity="0.7" />
  <polygon points="380,180 480,90 580,180 540,310 420,310" fill="#0F172A" stroke="#38BDF8" stroke-width="2" filter="url(#cyanGlow)" />

  <!-- Energy Beams -->
  <line x1="480" y1="0" x2="480" y2="540" stroke="#38BDF8" stroke-width="2" opacity="0.4" />
  <line x1="480" y1="200" x2="480" y2="400" stroke="#E0F2FE" stroke-width="6" opacity="0.8" />

  <!-- Ground Grid Platform -->
  <polygon points="0,440 960,440 960,540 0,540" fill="#090A0F" />
  <line x1="0" y1="440" x2="960" y2="440" stroke="#38BDF8" stroke-width="2" />
  <line x1="0" y1="470" x2="960" y2="470" stroke="#38BDF8" stroke-width="1" opacity="0.5" />
  <line x1="0" y1="505" x2="960" y2="505" stroke="#38BDF8" stroke-width="1" opacity="0.25" />

  <!-- Teaser Title Overlay -->
  <g transform="translate(480, 220)">
    <rect x="-320" y="-80" width="640" height="150" rx="10" fill="#090A0F" fill-opacity="0.9" stroke="#38BDF8" stroke-width="2" />
    <text x="0" y="-30" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="bold" letter-spacing="4">UPCOMING NEXT-GEN STANDALONE</text>
    <text x="0" y="15" text-anchor="middle" fill="#F8FAFC" font-family="'Chakra Petch', sans-serif" font-size="34" font-weight="700" letter-spacing="3">PROJECT ORGINITY 2</text>
    <text x="0" y="45" text-anchor="middle" fill="#94A3B8" font-size="16" letter-spacing="2">THE FALLEN CITADEL</text>
  </g>

  <!-- Badges -->
  <g transform="translate(480, 420)">
    <rect x="-160" y="-20" width="320" height="40" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" fill="#F59E0B" font-size="14" font-weight="bold" letter-spacing="2">COMING SOON • GODOT 4</text>
  </g>

  <text x="30" y="520" fill="#64748B" font-size="12">TARGET PLATFORMS: PC / MAC / LINUX DESKTOP STANDALONE</text>
  <text x="930" y="520" text-anchor="end" fill="#38BDF8" font-size="12">ROPODUCTIONS STUDIO</text>
</svg>