<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="image-rendering: pixelated; font-family: monospace;">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0B2E" />
      <stop offset="40%" stop-color="#4A154B" />
      <stop offset="70%" stop-color="#B83A4B" />
      <stop offset="90%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#7BF53A" />
      <stop offset="70%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <filter id="emeraldGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22C55E" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="960" height="540" fill="url(#skyGrad)" />

  <!-- Retro Sun -->
  <circle cx="480" cy="270" r="110" fill="url(#sunGrad)" opacity="0.9" />
  <line x1="360" y1="230" x2="600" y2="230" stroke="#B83A4B" stroke-width="4" />
  <line x1="370" y1="250" x2="590" y2="250" stroke="#B83A4B" stroke-width="6" />
  <line x1="390" y1="275" x2="570" y2="275" stroke="#B83A4B" stroke-width="8" />
  <line x1="420" y1="305" x2="540" y2="305" stroke="#B83A4B" stroke-width="10" />

  <!-- Distant Mountain Silhouettes -->
  <polygon points="0,540 0,380 90,320 220,410 380,290 510,400 660,310 820,420 960,340 960,540" fill="#180B26" />
  <!-- Mid Mountains -->
  <polygon points="0,540 0,420 140,360 280,450 450,350 590,440 760,370 960,450 960,540" fill="#0D0618" />

  <!-- Foreground Castle / Ruins -->
  <rect x="180" y="390" width="60" height="150" fill="#090A0F" />
  <rect x="200" y="360" width="20" height="30" fill="#090A0F" />
  <rect x="720" y="400" width="80" height="140" fill="#090A0F" />
  <rect x="745" y="370" width="30" height="30" fill="#090A0F" />

  <!-- Ground plane with grid lines -->
  <polygon points="0,470 960,470 960,540 0,540" fill="#090A0F" />
  <line x1="0" y1="472" x2="960" y2="472" stroke="#22C55E" stroke-width="2" opacity="0.6" />
  <line x1="0" y1="490" x2="960" y2="490" stroke="#22C55E" stroke-width="1" opacity="0.4" />
  <line x1="0" y1="515" x2="960" y2="515" stroke="#22C55E" stroke-width="1" opacity="0.2" />

  <!-- Title Logo -->
  <g transform="translate(480, 150)">
    <rect x="-300" y="-70" width="600" height="120" rx="8" fill="#090A0F" fill-opacity="0.85" stroke="#23283E" stroke-width="2" />
    <text x="0" y="-15" text-anchor="middle" fill="#F8FAFC" font-family="'Chakra Petch', sans-serif" font-size="16" font-weight="600" letter-spacing="6">ROPODUCTIONS PRESENTS</text>
    <text x="0" y="35" text-anchor="middle" fill="url(#logoGrad)" font-family="'Chakra Petch', sans-serif" font-size="44" font-weight="700" letter-spacing="4" filter="url(#emeraldGlow)">FINAL ORGINITY</text>
  </g>

  <!-- Menu Window -->
  <g transform="translate(480, 390)">
    <rect x="-140" y="-40" width="280" height="75" rx="6" fill="#121522" fill-opacity="0.95" stroke="#22C55E" stroke-width="2" />
    <text x="0" y="-12" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="bold" letter-spacing="2">► START GAME</text>
    <text x="0" y="16" text-anchor="middle" fill="#94A3B8" font-size="13" letter-spacing="1">CONTINUE / LOAD SAVE</text>
  </g>

  <!-- Version & Engine Badge -->
  <text x="20" y="525" fill="#94A3B8" font-size="12" opacity="0.8">ENGINE: RPG MAKER MZ (HTML5 WEB)</text>
  <text x="940" y="525" text-anchor="end" fill="#FBBF24" font-size="12" font-weight="bold">v1.2.0 • PATRON BUILD</text>
</svg>