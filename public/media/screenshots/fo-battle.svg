<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="image-rendering: pixelated; font-family: monospace;">
  <defs>
    <linearGradient id="battleBackdrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F081D" />
      <stop offset="60%" stop-color="#2D124D" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
  </defs>

  <!-- Background Arena -->
  <rect width="960" height="380" fill="url(#battleBackdrop)" />
  <!-- Arena Pillars -->
  <g opacity="0.3">
    <rect x="100" y="40" width="40" height="340" fill="#1E1B4B" />
    <rect x="300" y="40" width="40" height="340" fill="#1E1B4B" />
    <rect x="620" y="40" width="40" height="340" fill="#1E1B4B" />
    <rect x="820" y="40" width="40" height="340" fill="#1E1B4B" />
  </g>
  <!-- Floor Grid -->
  <polygon points="0,320 960,320 960,380 0,380" fill="#120D26" />
  <line x1="0" y1="320" x2="960" y2="320" stroke="#7C3AED" stroke-width="2" />

  <!-- Enemy: Shadow Overlord / Demon -->
  <g transform="translate(180, 100)">
    <ellipse cx="140" cy="220" rx="90" ry="16" fill="#000000" opacity="0.6" />
    <!-- Demon Body -->
    <path d="M70,80 Q140,20 210,80 Q250,160 210,210 Q140,230 70,210 Q30,160 70,80 Z" fill="#3B0764" stroke="#A855F7" stroke-width="3" />
    <!-- Horns -->
    <polygon points="80,70 50,20 100,60" fill="#6B21A8" />
    <polygon points="200,70 230,20 180,60" fill="#6B21A8" />
    <!-- Glowing Eyes -->
    <circle cx="115" cy="110" r="8" fill="#EF4444" />
    <circle cx="165" cy="110" r="8" fill="#EF4444" />
    <!-- Core Crystal -->
    <polygon points="140,140 155,165 140,190 125,165" fill="#EC4899" />
    <!-- Boss HP Bar -->
    <rect x="40" y="240" width="200" height="12" rx="3" fill="#1A1D2B" stroke="#23283E" stroke-width="1" />
    <rect x="40" y="240" width="145" height="12" rx="3" fill="#EF4444" />
    <text x="140" y="235" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="bold">ARCHDEMON MALAKOR</text>
  </g>

  <!-- Player Party Battlers (Right Side, RPG Maker MZ Classic Sideview) -->
  <!-- Battler 1: Kael -->
  <g transform="translate(680, 150)">
    <ellipse cx="25" cy="65" rx="20" ry="8" fill="#000000" opacity="0.6" />
    <rect x="15" y="20" width="20" height="40" fill="#E11D48" />
    <rect x="16" y="8" width="18" height="15" fill="#FDE047" />
    <line x1="10" y1="35" x2="3" y2="20" stroke="#CBD5E1" stroke-width="3" />
    <line x1="35" y1="35" x2="42" y2="20" stroke="#CBD5E1" stroke-width="3" />
  </g>
  <!-- Battler 2: Lyra -->
  <g transform="translate(750, 200)">
    <ellipse cx="25" cy="65" rx="20" ry="8" fill="#000000" opacity="0.6" />
    <rect x="15" y="20" width="20" height="40" fill="#15803D" />
    <rect x="16" y="8" width="18" height="15" fill="#6EE7B7" />
    <circle cx="5" cy="30" r="7" fill="#22C55E" />
  </g>
  <!-- Battler 3: Morgana -->
  <g transform="translate(820, 250)">
    <ellipse cx="25" cy="65" rx="20" ry="8" fill="#000000" opacity="0.6" />
    <rect x="15" y="20" width="20" height="40" fill="#581C87" />
    <rect x="16" y="8" width="18" height="15" fill="#C084FC" />
    <circle cx="38" cy="25" r="9" fill="#A855F7" />
  </g>

  <!-- RPG Maker MZ Battle HUD Bottom Panel -->
  <rect x="0" y="380" width="960" height="160" fill="#090A0F" stroke="#23283E" stroke-width="2" />
  
  <!-- Party Status Window -->
  <g transform="translate(20, 395)">
    <rect width="600" height="130" rx="8" fill="#121522" stroke="#23283E" stroke-width="1.5" />
    <!-- Member 1 -->
    <text x="20" y="35" fill="#F8FAFC" font-size="15" font-weight="bold">Kael</text>
    <text x="120" y="35" fill="#22C55E" font-size="13">HP 450/450</text>
    <text x="240" y="35" fill="#38BDF8" font-size="13">MP 120/120</text>
    <text x="360" y="35" fill="#FBBF24" font-size="13">TP 85%</text>
    <!-- Member 2 -->
    <text x="20" y="70" fill="#F8FAFC" font-size="15" font-weight="bold">Lyra</text>
    <text x="120" y="70" fill="#22C55E" font-size="13">HP 320/320</text>
    <text x="240" y="70" fill="#38BDF8" font-size="13">MP 280/280</text>
    <text x="360" y="70" fill="#FBBF24" font-size="13">TP 100% (READY)</text>
    <!-- Member 3 -->
    <text x="20" y="105" fill="#F8FAFC" font-size="15" font-weight="bold">Morgana</text>
    <text x="120" y="105" fill="#22C55E" font-size="13">HP 290/290</text>
    <text x="240" y="105" fill="#38BDF8" font-size="13">MP 340/350</text>
    <text x="360" y="105" fill="#FBBF24" font-size="13">TP 45%</text>
  </g>

  <!-- Command Menu Window -->
  <g transform="translate(640, 395)">
    <rect width="300" height="130" rx="8" fill="#121522" stroke="#22C55E" stroke-width="2" />
    <rect x="15" y="15" width="270" height="26" rx="4" fill="#22C55E" fill-opacity="0.25" stroke="#22C55E" stroke-width="1" />
    <text x="30" y="33" fill="#22C55E" font-size="14" font-weight="bold">► ATTACK</text>
    <text x="30" y="60" fill="#F8FAFC" font-size="14">  SKILL / SPELL</text>
    <text x="30" y="87" fill="#F8FAFC" font-size="14">  GUARD</text>
    <text x="30" y="114" fill="#94A3B8" font-size="14">  ITEM</text>
  </g>
</svg>